name: IR codegen sweep

# THE SUNIT SUITE WITH DIRECT-TO-IR CODEGEN ON.
#
# WHY THIS EXISTS.  `ci.yml` runs the shards with
# GRAIL_IR_CODEGEN unset, so nothing in the pre-merge pipeline compiles a line
# through the IR path.  The flag-on sweep has been a thing a person ran by hand,
# and what that let through is on record:
#
#   * #1118 -- a def-registration id that was a per-session COUNTER compiled as
#     a literal into committed methods.  Latent, not a regression: it needed
#     enough registrations in one session to land on a live id, and 65 flag-on
#     defects on main traced to it.  It was found only when the default was
#     about to flip (#1087, cut note 132).
#   * #1122 -- the attribute/subscript aug-assign emit still applying the bare
#     binary dunder after the TEXT emitters were corrected.  The text path is
#     correct, so no flag-off run could see it (cut note 133).
#
# Neither was anybody's regression in the ordinary sense, and that is the
# point: an arm nothing runs accumulates defects that no single PR introduced,
# and they then have to be bisected out of a week of merges.
#
# It lived on a branch (`ci/ir-flag-on-sweep`) while it was red, because a red
# check on main would have blocked every unrelated PR; `main` was merged into
# the branch as the IR defects were fixed.  The first fully green sweep was run
# 35881184586 (2026-09-23, main at 2ae6eb94, #1140): 7322 run, 0 failed, 0
# errors across all eight shards, with the seam probe confirming IR was live.
# In the meantime `main` picked up a new IR defect roughly every half day
# (#1122, #1125, #1128, #1129, #1140), each found hours after it merged.  On the
# pull request, the PR that introduces the next one sees it instead.
#
# The recurring shape is worth naming, because it is what this job exists to
# catch: a TEXT emitter in PythonAst/ is corrected and its hand-written IR copy
# is not.  The text path is correct, so nothing in `ci.yml` can see it.
#
# GRAIL_IR_CODEGEN=1 RATHER THAN RELYING ON THE DEFAULT, deliberately and
# permanently.  `=1` reads as the IR arm both before and after #1087 flips the
# default, so this workflow needs no edit when that lands -- and it keeps saying
# what it measures rather than inheriting whatever the default happens to be.
#
# Everything else mirrors `ci.yml`'s `test-main` job: same container, same
# non-root `ci` user, same four-runners-over-eight-shards split (a memory budget
# rather than a speed one -- see the matrix comment there).

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  # As in ci.yml: a new commit on the same PR cancels the older in-flight run,
  # and merge-queue entries each get their own ref, so they never cancel one
  # another.
  group: ir-sweep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sunit-ir:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      # Every shard's result is wanted, not just the first failure: the point of
      # the sweep is the LIST of what IR breaks.
      fail-fast: false
      matrix:
        include:
          - { name: a, shards: "0 1" }
          - { name: b, shards: "2 3" }
          - { name: c, shards: "4 5" }
          - { name: d, shards: "6 7" }
    container:
      image: container.gemtalksystems.com/gemstone/gemstone/main:grail
      options: --shm-size=1g
      credentials:
        username: ${{ secrets.GEMSTONE_CONTAINER_USER }}
        password: ${{ secrets.GEMSTONE_CONTAINER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: install + run SUnit shards ${{ matrix.shards }} with IR ON
        run: |
          chown -R ci:ci "$GITHUB_WORKSPACE"
          runuser -u ci -- env -u GITHUB_ENV -u GITHUB_PATH \
            HOME=/home/ci \
            GEMSTONE=/opt/gemstone/product \
            GEMSTONE_NAME=gs64stone \
            GRAIL_NETLDI=gs64ldi \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            GRAIL_TEST_SHARDS="${{ matrix.shards }}" \
            GRAIL_IR_CODEGEN=1 \
            bash -ex -c '
              export PATH="$GEMSTONE/bin:$PATH"
              export GEMSTONE_GLOBAL_DIR="$GITHUB_WORKSPACE/testing"
              tests/github/setup-testing-env.sh
              cd "$GEMSTONE_GLOBAL_DIR"
              startstone -e stone.conf gs64stone
              waitstone gs64stone 60
              startnetldi -g gs64ldi
              cd "$GITHUB_WORKSPACE"
              ./install_base.sh
              ./install.sh
              ./scripts/run_tests.sh
            '

      # PROVE THE SEAM WAS LIVE.  A run that silently fell back to text scores
      # exactly like the ordinary suite, so a green sweep would mean nothing
      # without this.  Runs even when the shards failed, because knowing the arm
      # was real is what makes a RED sweep interpretable too.
      #
      # The probe is a FILE in the tree rather than a heredoc here: topaz needs
      # its `%' terminators at column 0, and a heredoc indented to match this
      # YAML would write them indented and silently change what the script
      # means.  A file also runs locally, unchanged.
      #
      # No -I on the topaz line: topaz finds ./.topazini locally and the
      # ~/.topazini that setup-testing-env.sh writes in CI -- which is how
      # install.sh and run_tests.sh log in.  An explicit ./.topazini failed on
      # all four runners of the first sweep (35815422255).  The -C is
      # run_tests.sh's own TOPAZ_CFG; the import OOMs under bare defaults.
      #
      # NO COMMENTS INSIDE THE bash -c BODY, and no apostrophes in it at all.
      # The body is one single-quoted string, so an apostrophe closes it: the
      # second sweep (35819374570) had one in a comment, the inner script was
      # cut to nine lines, and the OUTER shell ran the probe as the job user
      # with no ~/.topazini -- "Stopping at line 10" (the login), reported as
      # IR being OFF.  YAML comments out here cannot do that.
      - name: prove IR was actually running
        if: always()
        run: |
          runuser -u ci -- env -u GITHUB_ENV -u GITHUB_PATH \
            HOME=/home/ci \
            GEMSTONE=/opt/gemstone/product \
            GEMSTONE_NAME=gs64stone \
            GRAIL_NETLDI=gs64ldi \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            GRAIL_IR_CODEGEN=1 \
            bash -ex -c '
              export PATH="$GEMSTONE/bin:$PATH"
              export GEMSTONE_GLOBAL_DIR="$GITHUB_WORKSPACE/testing"
              cd "$GITHUB_WORKSPACE"
              topaz -lq -C "GEM_TEMPOBJ_CODE_SIZE=300000;GEM_TEMPOBJ_CACHE_SIZE=900000;GEM_MAX_SMALLTALK_STACK_DEPTH=48000;" \
                -S tests/github/ir_seam_control.gs \
                < /dev/null | tee /tmp/ir_control.out
              grep -q "^IRFLAG|true" /tmp/ir_control.out \
                || { echo "IR reported itself OFF in a sweep that sets GRAIL_IR_CODEGEN=1"; exit 1; }
              compiled=$(grep "^IRCOMPILED|" /tmp/ir_control.out | cut -d"|" -f2)
              [ "${compiled:-0}" -gt 0 ] \
                || { echo "the seam compiled nothing: this sweep measured the TEXT path"; exit 1; }
              echo "seam live: compiled=$compiled"
            '

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grail-ir-sweep-logs-shards-${{ matrix.name }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            *.out
            out/*.out
            testing/*.log
            testing/log/**
