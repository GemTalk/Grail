name: CPython conformance

# The CPython regression-suite scoreboard (scripts/run_cpython_suite.sh) is a
# heavy job -- ~106 min of module wall clock on one CI runner as of 2026-10-26,
# dominated by the biggest modules (test___all__, test_math, test_bytes,
# test_pickle) -- so it is too slow for the every-push critical path (that is
# the SUnit gate in ci.yml).  It runs here on a NIGHTLY schedule + on-demand
# instead, split into SHARDS: a plan job divides the manifest by measured
# duration, one container job per shard installs Grail and runs its share, and
# a gate job builds the board from all of their outputs and gates it.  As one
# job it outgrew its 90-minute limit, and three nightlies in a row were killed
# mid-suite with nothing measured.
#
# The run regenerates docs/CPython_Suite_Scoreboard.md and gates on a NEGATIVE
# delta vs the committed baseline (scripts/check_cpython_regressions.sh): a
# module with more fail+err, an OK module that stopped passing, or a new
# CRASH/TIMEOUT/IMPORTERROR fails the gate job.  A red scheduled run is a
# NOTIFICATION, not a merge blocker.
#
# BASELINE MAINTENANCE IS AUTOMATED HERE, and it has to be, because the baseline
# and the gate were being measured on different machines.  The committed board is
# refreshed by whoever last ran the suite -- historically on their own laptop --
# while the only thing that ever gates it runs on Linux x86_64.  Those numbers do
# not always agree: as of 2026-08-27 test.test_traceback reads 14 fail+err on
# Darwin arm64 and 16 here, deterministically in both, because
# MiscTracebackCases.test_extract_stack and TestTracebackFormat.test_format_stack
# fail only on Linux.  A locally-measured baseline therefore made this workflow
# report a REGRESSION every night on a row nobody had touched -- 11 nightlies
# running -- which is the fastest way to teach everyone to ignore a red nightly.
#
# So the refresh-baseline job below proposes the CI-measured board as a PR:
#
#   * on a scheduled run that found improvements and NO regressions -- the
#     ordinary ratchet, so conformance gains land in the baseline on their own;
#   * on a manual run with refresh_baseline=true -- for anything else, including
#     absorbing a platform-only delta like the one above.
#
# It never opens a PR for a run with regressions unless explicitly asked, so a
# real regression cannot be quietly baselined away.  The PR is the review point.
#
# NOTE ON WHAT THIS DOES NOT DO: the conformance gate is not in the pre-merge
# pipeline (that is ci.yml, which runs the SUnit shards and the fixtures and
# never touches this scoreboard).  A scoreboard regression is therefore first
# seen HERE, a day of merges wide.  That is a deliberate trade -- the suite is
# ~35 min even sharded -- and the tiering rule in CLAUDE.md is what covers it: run the full
# suite locally before a PR that touches shared machinery.

on:
  schedule:
    - cron: '17 7 * * *'   # 07:17 UTC daily (off-peak; avoids top-of-hour load)
  workflow_dispatch:
    inputs:
      refresh_baseline:
        description: "Open a PR with the CI-measured scoreboard, even if the gate found regressions"
        type: boolean
        default: false
      modules:
        description: "Space-separated modules to run INSTEAD of the full manifest (e.g. 'test.test_iter'). Diagnostic only: the gate and the baseline refresh are skipped."
        type: string
        default: ""

concurrency:
  group: cpython-conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Split the manifest into SHARDS lists of modules with roughly equal wall
  # clock, weighted by the previous runs' per-module durations
  # (run_cpython_suite.sh --plan-shards).  Planned ONCE, here, and handed to
  # each shard as its matrix entry: if every shard planned for itself from the
  # duration cache, a shard starting after another had saved a newer cache
  # could compute a different split, and a module would run twice or not at
  # all.  No stone needed, so no container.
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore module durations
        uses: actions/cache/restore@v4
        with:
          path: out/cpython/*.sec
          key: cpython-durations-${{ github.run_id }}
          restore-keys: cpython-durations-

      - name: Plan the shards
        id: plan
        # FOUR SHARDS.  As of 2026-10-26 the modules add up to ~12,700s of wall
        # clock on a CI runner, which at two concurrent modules is ~106 minutes:
        # past the 90-minute job limit, so the nightlies of 10-24, 10-25 and
        # 10-26 were all killed mid-suite and measured nothing.  Four shards
        # plan at ~26 minutes each, plus ~6 for the container and the install.
        # The floor is the single longest module (test___all__, ~13 minutes),
        # so more shards buy less and less.
        env:
          SHARDS: 4
          GRAIL_MODULES: ${{ inputs.modules }}
        run: |
          # Unquoted on purpose: the input is a space-separated LIST.  A
          # targeted run is planned the same way, over just those modules.
          ./scripts/run_cpython_suite.sh --plan-shards "$SHARDS" $GRAIL_MODULES > plan.txt
          # An empty line is a shard with nothing to run (fewer modules than
          # shards); it gets no job.
          matrix=$(jq -R -s -c 'split("\n") | map(select(length > 0))
            | to_entries | map({shard: (.key + 1), modules: .value}) | {include: .}' plan.txt)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          { echo "### CPython conformance shards"
            echo
            jq -r '.include[] | "* shard \(.shard): \(.modules | split(" ") | length) modules"' <<< "$matrix"
          } >> "$GITHUB_STEP_SUMMARY"

  conformance:
    name: conformance (shard ${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-22.04
    # 90 is the old whole-suite limit, kept as a ceiling: a shard plans at
    # about a third of it.  The headroom is for one hung module, which the
    # per-module cap (GRAIL_TEST_TIMEOUT=1800) ends after 30 minutes.
    timeout-minutes: 90
    strategy:
      # Every shard's rows are needed for the board; one red shard must not
      # cancel the others.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Same image as ci.yml's test-main: GemTalk's GemStone 4.0 container.
    container:
      image: container.gemtalksystems.com/gemstone/gemstone/main:grail
      options: --shm-size=1g
      # The GemTalk registry is private; unavailable to fork PRs.
      credentials:
        username: ${{ secrets.GEMSTONE_CONTAINER_USER }}
        password: ${{ secrets.GEMSTONE_CONTAINER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Within a shard, run_cpython_suite.sh still launches heaviest-first by
      # these durations.  Only the ORDER depends on them here -- which modules
      # this shard runs was fixed by the plan job -- so a cache that differs
      # from the one the plan read is harmless.
      - name: Restore module durations
        uses: actions/cache/restore@v4
        with:
          path: out/cpython/*.sec
          key: cpython-durations-${{ github.run_id }}
          restore-keys: cpython-durations-

      # Same non-root 'ci' pattern as ci.yml (NetLDI guest mode needs it).
      - name: install + cpython conformance (as non-root 'ci')
        # Via env: rather than interpolated into the script, so neither the
        # input nor the planned list can be spliced into the shell command line.
        env:
          GRAIL_MODULES: ${{ inputs.modules }}
          SHARD_MODULES: ${{ matrix.modules }}
        run: |
          chown -R ci:ci "$GITHUB_WORKSPACE"
          runuser -u ci -- env -u GITHUB_ENV -u GITHUB_PATH \
            HOME=/home/ci \
            GEMSTONE=/opt/gemstone/product \
            GEMSTONE_NAME=gs64stone \
            GRAIL_NETLDI=gs64ldi \
            GRAIL_MODULES="$GRAIL_MODULES" \
            SHARD_MODULES="$SHARD_MODULES" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -ex -c '
              export PATH="$GEMSTONE/bin:$PATH"
              export GEMSTONE_GLOBAL_DIR="$GITHUB_WORKSPACE/testing"
              tests/github/setup-testing-env.sh
              cd "$GEMSTONE_GLOBAL_DIR"
              startstone -e stone.conf gs64stone
              waitstone gs64stone 60
              startnetldi -g gs64ldi
              cd "$GITHUB_WORKSPACE"
              ./install_base.sh
              ./install.sh
              # A TARGETED run exists for one reason: several rows fail here and
              # nowhere else -- the test_traceback rows test_extract_stack and
              # test_format_stack are Linux-only, and as of 2026-08-28 so is
              # the test_iter row test_exception_locations, which passes on Darwin
              # arm64 on 3.7.5 AND 4.0, at the very SHA this workflow failed on.
              # Chasing one of those used to cost a 33-minute blind nightly per
              # attempt; naming the module costs a couple of minutes, and the
              # per-module .out (uploaded below) carries the GRAIL_DETAIL line.
              if [ -n "$GRAIL_MODULES" ]; then
                # Dump the GENERATED Smalltalk for the named modules.  For a
                # platform-only row this is the whole point: the Darwin box can
                # generate the same module and DIFF the two, which is the one
                # question a pass/fail line cannot answer.  Full-manifest runs
                # leave it unset -- 185 modules of codegen is not an artifact.
                export GRAIL_CODEGEN_TRACE_DIR="$GITHUB_WORKSPACE/out/codegen"
                mkdir -p "$GRAIL_CODEGEN_TRACE_DIR"
              fi
              # Lower concurrency (2, not the default 4) + a generous per-module
              # cap so the heavy modules COMPLETE on slower CI cores instead of
              # false-TIMEOUTing under 4-way stone contention.  Deterministic
              # per-module numbers are what make the regression gate trustworthy.
              #
              # A partial run by construction: it writes the outputs of this
              # shard and leaves the board alone.  The gate job builds the
              # board from the outputs of every shard.  Unquoted: a LIST.
              GRAIL_CPYTHON_WORKERS=2 GRAIL_TEST_TIMEOUT=1800 ./scripts/run_cpython_suite.sh $SHARD_MODULES
            '

      # ONLY this shard's modules' files, in a directory of their own.  The
      # gate merges every shard's artifact into one out/cpython, and
      # out/cpython here also holds the restored .sec of every other module --
      # uploaded too, a stale one could overwrite the fresh timing another
      # shard measured.  Always, so a shard the timeout killed still delivers
      # what it finished; what it did not finish scores CRASH at the gate.
      - name: Collect this shard's results
        if: always()
        env:
          SHARD_MODULES: ${{ matrix.modules }}
        run: |
          mkdir -p shard-out
          for m in $SHARD_MODULES; do
            for ext in out rc sec; do
              [ -f "out/cpython/$m.$ext" ] && cp "out/cpython/$m.$ext" shard-out/
            done
          done
          echo "$(find shard-out -type f | wc -l) result files from this shard"

      - name: Upload this shard's results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpython-results-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 14
          path: shard-out/

      # Kept apart from the results: the gate merges every cpython-results-*
      # into one directory, and each shard's stone logs have the same names.
      - name: Upload this shard's stone logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpython-logs-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            out/codegen/**
            testing/*.log
            testing/log/**

  # Build the board from every shard's outputs and gate it -- what the single
  # job used to do at the end of its run.  run_cpython_suite.sh --report-only
  # scores the merged out/cpython in manifest order, exactly as a one-job run
  # would have, and a module whose output never arrived (a shard that failed
  # to install, or was killed before it got there) scores CRASH: the gate then
  # fails on it rather than gating a board with rows missing.  No stone, so no
  # container.
  #
  # Runs after a red shard too (the board is how one reads what went wrong),
  # but not when the run itself was cancelled.
  gate:
    needs: [plan, conformance]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      regressions: ${{ steps.gate.outputs.regressions }}
      improvements: ${{ steps.gate.outputs.improvements }}
    steps:
      - uses: actions/checkout@v4

      # The previous timings first, then this run's on top: a module whose
      # shard was lost keeps its old weight for the next plan instead of
      # falling back to the test-count estimate.
      - name: Restore module durations
        uses: actions/cache/restore@v4
        with:
          path: out/cpython/*.sec
          key: cpython-durations-${{ github.run_id }}
          restore-keys: cpython-durations-

      - name: Download every shard's results
        uses: actions/download-artifact@v4
        with:
          pattern: cpython-results-*
          path: out/cpython
          merge-multiple: true

      - name: Score the shards and gate the board
        env:
          GRAIL_MODULES: ${{ inputs.modules }}
        run: |
          set +e
          # 1800 is the shards' per-module cap; a TIMEOUT row's detail names it.
          if [ -n "$GRAIL_MODULES" ]; then
            GRAIL_TEST_TIMEOUT=1800 ./scripts/run_cpython_suite.sh --report-only $GRAIL_MODULES
            # No gate line, deliberately.  check_cpython_regressions.sh
            # compares against the FULL-manifest baseline, so every module
            # not named would read as vanished.  The verdict parser fails
            # closed on an unparseable summary, which is what keeps a
            # targeted run from opening a baseline-refresh PR.
            echo "targeted run of: $GRAIL_MODULES -- regression gate SKIPPED (a partial run cannot be compared with the full-manifest baseline)" | tee gate-output.txt
            echo 0 > gate-rc.txt
          else
            GRAIL_TEST_TIMEOUT=1800 ./scripts/run_cpython_suite.sh --report-only
            # The gate verdict is CAPTURED rather than allowed to abort here,
            # so the refresh job downstream can see whether the delta was
            # improvements-only.  The job still fails on a regression -- the
            # "Enforce the gate" step below does it, reading this file.
            ./scripts/check_cpython_regressions.sh 2>&1 | tee gate-output.txt
            echo "${PIPESTATUS[0]}" > gate-rc.txt
          fi

      # Parsed from the gate's own summary line:
      #   cpython regression gate: N regression(s), M improvement(s)
      - name: Read the gate verdict
        id: gate
        if: always()
        run: |
          rc=$(cat gate-rc.txt 2>/dev/null || echo 1)
          line=$(grep -o 'cpython regression gate: .*' gate-output.txt 2>/dev/null || true)
          # [0-9][0-9]* rather than [0-9]\+ : BSD sed has no \+ in a BRE, so the
          # \+ form parses on the GNU sed CI runs and silently answers nothing
          # anywhere else -- including in whatever shell someone tests this in.
          reg=$(printf '%s' "$line" | sed -n 's/.* \([0-9][0-9]*\) regression(s).*/\1/p')
          imp=$(printf '%s' "$line" | sed -n 's/.* \([0-9][0-9]*\) improvement(s).*/\1/p')
          # An unparseable summary must NOT read as "0 regressions" -- that would
          # let a crashed run open a baseline-refresh PR.  Fail closed instead.
          [ -n "$reg" ] || reg=-1
          [ -n "$imp" ] || imp=0
          echo "rc=$rc"            >> "$GITHUB_OUTPUT"
          echo "regressions=$reg"  >> "$GITHUB_OUTPUT"
          echo "improvements=$imp" >> "$GITHUB_OUTPUT"
          { echo "### CPython conformance gate"
            echo
            echo "\`${line:-(no summary line -- see the log)}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Saved here, once, from the merged timings, so the next plan reads one
      # cache that holds every shard's measurements.  Restore and save are
      # separate steps so the save runs on a red gate too: a module newly
      # unblocked (test_pickle, costed at ~0s while it was an IMPORTERROR) has
      # to be weighted by its real duration in the next plan, or it lands in
      # whichever shard is lightest and stretches it.
      - name: Save module durations
        if: always()
        uses: actions/cache/save@v4
        with:
          path: out/cpython/*.sec
          key: cpython-durations-${{ github.run_id }}

      - name: Upload scoreboard + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpython-scoreboard
          if-no-files-found: ignore
          retention-days: 14
          # The regenerated scoreboard (commit it to move the baseline forward)
          # + per-module logs + JSON + per-module wall clock (.sec), so a slow
          # run can be read module by module.  The stone logs are in each
          # shard's cpython-logs-N.
          path: |
            docs/CPython_Suite_Scoreboard.md
            out/cpython/*.out
            out/cpython/*.sec
            out/cpython/scoreboard.json
            gate-output.txt
            gate-rc.txt

      # Deliberately LAST in this job: the artifact is uploaded and the summary
      # written before the job is allowed to go red, so a regression still leaves
      # every .out behind to diagnose from.
      - name: Enforce the gate
        if: always()
        run: |
          rc=$(cat gate-rc.txt 2>/dev/null || echo 1)
          if [ "$rc" != "0" ]; then
            echo "cpython regression gate failed (rc=$rc) -- see the log and the cpython-scoreboard artifact." >&2
            exit 1
          fi

  # Propose the CI-measured scoreboard as the committed baseline.  Runs OUTSIDE
  # the GemStone container on a plain runner: it needs git, gh and the artifact,
  # none of which want the container's non-root/chown dance.
  #
  # DEPENDS ON A REPO SETTING: Actions must be allowed to create pull requests
  # (Settings > Actions > General > "Allow GitHub Actions to create and approve
  # pull requests").  Without it the push succeeds and `gh pr create' fails with
  # 403 -- the branch is still there to open by hand, so nothing is lost, but
  # the job goes red for a reason that is not about conformance.
  refresh-baseline:
    needs: [conformance, gate]
    # Never from a run with a red or lost shard, even when asked: its missing
    # modules are CRASH rows on the board, and refresh_baseline=true would
    # commit them as the baseline.
    if: >-
      always()
      && needs.conformance.result == 'success'
      && needs.gate.result != 'cancelled'
      && needs.gate.result != 'skipped'
      && (
           (github.event_name == 'workflow_dispatch' && inputs.refresh_baseline && !inputs.modules)
           || (
                github.event_name == 'schedule'
                && needs.gate.outputs.regressions == '0'
                && needs.gate.outputs.improvements != '0'
              )
         )
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the CI-measured scoreboard
        uses: actions/download-artifact@v4
        with:
          name: cpython-scoreboard
          path: artifact

      - name: Open a baseline-refresh PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGRESSIONS: ${{ needs.gate.outputs.regressions }}
          IMPROVEMENTS: ${{ needs.gate.outputs.improvements }}
        run: |
          set -euo pipefail
          board=docs/CPython_Suite_Scoreboard.md
          src="artifact/$board"
          if [ ! -f "$src" ]; then
            echo "no scoreboard in the artifact -- the suite did not finish; nothing to refresh." >&2
            exit 1
          fi
          cp "$src" "$board"
          # The scope doc is derived from the board, and ci.yml's scripts job
          # fails a PR whose doc does not match it -- this one included, in the
          # merge queue.
          scope=docs/Grail_CPython_Scope.md
          python3 scripts/sync_scope_status.py
          if git diff --quiet -- "$board"; then
            echo "CI-measured board is identical to the committed baseline -- nothing to do."
            exit 0
          fi

          # The rows that MOVED, so the PR is reviewable without reading a
          # hundred-row diff.
          rows=$(git diff -U0 -- "$board" | grep -E '^[+-]\| test' || true)
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # printf rather than a heredoc: a heredoc body inside a YAML block
          # scalar has to be indented to stay valid YAML, and that indentation
          # then lands in the commit message.
          printf '%s\n' \
            "Refresh the CPython baseline from CI (run ${GITHUB_RUN_ID})" \
            "" \
            "Measured by the CPython conformance workflow on Linux x86_64 -- the" \
            "platform check_cpython_regressions.sh gates on.  Gate verdict for this" \
            "run: ${REGRESSIONS} regression(s), ${IMPROVEMENTS} improvement(s)." \
            "" \
            "Opened automatically because the baseline and the gate have to be" \
            "measured on the same platform.  A board committed from a local run can" \
            "differ from what CI can reach, which made the nightly report a" \
            "regression on a row nobody had touched." \
            "" \
            "Run: ${run_url}" > commit-msg.txt

          {
            printf 'Measured by this workflow on **Linux x86_64** -- the platform `check_cpython_regressions.sh` gates on.\n\n'
            printf 'Gate verdict for [run %s](%s): **%s regression(s), %s improvement(s)**.\n\n' \
              "${GITHUB_RUN_ID}" "$run_url" "${REGRESSIONS}" "${IMPROVEMENTS}"
            printf 'Rows that moved:\n\n```\n%s\n```\n\n' "${rows:-(none -- header-only change)}"
            printf 'Why this is automated: the committed board used to be refreshed from whoever last ran the suite locally, while the only thing that gates it runs here. Those numbers do not always agree, so the nightly reported a regression on a row nobody had touched.\n'
          } > pr-body.md

          branch="ci/refresh-cpython-baseline-${GITHUB_RUN_ID}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$board" "$scope"
          git commit -F commit-msg.txt
          git push origin "$branch"
          gh pr create \
            --title "Refresh the CPython baseline from CI (run ${GITHUB_RUN_ID})" \
            --body-file pr-body.md \
            --base "${GITHUB_REF_NAME}" \
            --head "$branch"
