name: CI

# Installs Grail and runs its SUnit gate against a fresh GemStone stone.
#
# The `test` job runs inside the prebuilt ci-base image (Ubuntu 22.04 + Python
# 3.14 + C toolchain + the GemStone product), published by the build-ci-image
# workflow to this repo's GitHub Container Registry.  Because the product is
# baked into the image, the job neither downloads nor unzips it -- it just lays
# down a fresh extent and runs install.sh + scripts/run_tests.sh.
#
# `test` is a MATRIX that splits the SUnit shards across parallel runners (each
# does its own ~10s install against its own extent and runs HALF the shards),
# so the dominant shard phase roughly halves.  This is the authoritative
# pass/fail gate.  The heavier CPython conformance scoreboard (~20-30 min on CI)
# is too slow for the per-push path and lives in .github/workflows/
# cpython-conformance.yml (nightly + on-demand).
#
# Run build-ci-image ONCE before this workflow can run (the container pull needs
# ci-base:latest to exist).

# Triggers: exactly ONE run per commit that matters, and a run the merge queue
# can gate on.  `push` is deliberately OMITTED -- the original reason for
# avoiding a push+pull_request pair still holds (no single concurrency key
# dedupes a push ref (refs/heads/x) against a pull_request ref
# (refs/pull/N/merge)), so listening to both would double-run the same commit.
# We keep `pull_request` rather than `push` because it is the only trigger that
# gives PRs opened from FORKS any checks at all, which the push-only setup could
# not do.  A post-merge run on `main` adds nothing: `merge_group` already tests
# the exact merge commit that is about to land, so `main` is validated before
# the fact instead of after it.  Work on a branch with no PR open is
# intentionally not tested -- open the PR (or use `workflow_dispatch`).
on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  # Per-ref: a new commit on the same PR cancels the older in-flight run.  Merge
  # queue entries each get their own ref, so they never cancel one another.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read    # pull ci-base from GHCR (harmless if the package is public)

jobs:
  # Compute the lowercase GHCR image ref. GHCR rejects uppercase and the
  # owner/repo slug may contain capitals; a job output is the only place a
  # computed value can reach `container.image`.
  image:
    runs-on: ubuntu-22.04
    outputs:
      ref: ${{ steps.n.outputs.ref }}
    steps:
      - id: n
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/ci-base:latest" >> "$GITHUB_OUTPUT"

  # Self-tests for the shell tooling CI itself depends on -- no container, no
  # stone, ~seconds.  The conformance gate decides whether a scoreboard delta is
  # a regression, so a bug in it can turn a real regression into a green run;
  # that makes it worth checking on every push even though the conformance
  # measurement itself is nightly.
  scripts:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: cpython regression-gate self-test
        run: tests/scripts/test_regression_gate.sh

      # The fixture gate runs tests/python's self-running fixtures under real
      # CPython, so it needs the version the fixtures were written against --
      # the runner's system python3 is 3.10 and predates ExceptionGroup.  This
      # is the only step here that needs an interpreter; everything else in
      # this job is pure shell.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: fixture-gate self-test
        run: tests/scripts/test_python_fixture_gate.sh

      # Catches a fixture that encodes Grail's behaviour instead of CPython's,
      # which would otherwise read as conformance evidence forever after.
      - name: tests/python fixtures agree with CPython
        run: scripts/check_python_fixtures.sh -v

  test:
    needs: image
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      # Don't let one shard group's failure cancel the other -- we want both.
      fail-fast: false
      matrix:
        # Split the 4 SUnit shards across 2 parallel runners (2 each).  The
        # partition COUNT stays 4 (GRAIL_TEST_WORKERS default), so the stable
        # class->shard mapping is unchanged; only which shards a runner executes
        # differs.  `name` gives collision-free artifact names (matrix.shards
        # contains a space).
        include:
          - { name: a, shards: "0 1" }
          - { name: b, shards: "2 3" }
    # Runs inside ci-base. --shm-size lifts the container's default 64 MB
    # /dev/shm so GemStone's shared page cache fits. GEMSTONE/PATH come from the
    # image ENV.
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --shm-size=1g
      # Works whether ci-base is public or private; drop this block if you make
      # it public and prefer a credential-free pull.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # NetLDI guest mode (-g) is disallowed when NetLDI runs as root, and a
      # GitHub container job runs as root.  Keep the job root (GitHub needs it
      # for the workspace mount + JS actions) but run ALL GemStone work as the
      # non-root 'ci' user baked into the image.  Hand it the checked-out tree
      # first (checkout wrote it as root).  Everything runs in one shell, so no
      # $GITHUB_ENV hand-off is needed (and ci can't write those root files, so
      # they're dropped with `env -u`).
      - name: install + run SUnit shards ${{ matrix.shards }} (as non-root 'ci')
        run: |
          chown -R ci:ci "$GITHUB_WORKSPACE"
          runuser -u ci -- env -u GITHUB_ENV -u GITHUB_PATH \
            HOME=/home/ci \
            GEMSTONE=/opt/gemstone/product \
            GEMSTONE_NAME=gs64stone \
            GRAIL_NETLDI=gs64ldi \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            GRAIL_TEST_SHARDS="${{ matrix.shards }}" \
            bash -ex -c '
              export PATH="$GEMSTONE/bin:$PATH"
              export GEMSTONE_GLOBAL_DIR="$GITHUB_WORKSPACE/testing"
              tests/github/setup-testing-env.sh
              cd "$GEMSTONE_GLOBAL_DIR"
              startstone -e stone.conf gs64stone
              waitstone gs64stone 60
              startnetldi -g gs64ldi
              cd "$GITHUB_WORKSPACE"
              ./install_base.sh
              ./install.sh
              ./scripts/run_tests.sh
            '

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per-group name: matrix jobs must not collide on artifact names.
          name: grail-ci-logs-shards-${{ matrix.name }}
          if-no-files-found: ignore
          retention-days: 7
          # .out logs + stone/gem logs; the extent is deliberately excluded.
          path: |
            *.out
            out/*.out
            testing/*.log
            testing/log/**

  # Single stable check for branch protection / the merge queue to require.
  # The matrix job's own check names embed the matrix values, so requiring
  # `test` directly is brittle; this fans them in to one name instead.
  # `if: always()` is essential: without it the job would be SKIPPED whenever a
  # dependency fails, a required check would never report a conclusion, and the
  # PR (or queue entry) would hang forever.
  ci-complete:
    name: ci-complete
    if: always()
    needs: [image, test, scripts]
    runs-on: ubuntu-22.04
    steps:
      - name: Verify all CI jobs succeeded
        run: |
          if [ "${{ needs.image.result }}" != "success" ] \
            || [ "${{ needs.test.result }}" != "success" ] \
            || [ "${{ needs.scripts.result }}" != "success" ]; then
            echo "image=${{ needs.image.result }} test=${{ needs.test.result }} scripts=${{ needs.scripts.result }}"
            exit 1
          fi
